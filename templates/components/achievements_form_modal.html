<div id="add-achievements-modal" class="achievements-form-modal" popover="auto" role="dialog" aria-modal="true"
    aria-labelledby="add-achievements-modal-title">
    <button type="button" class="achievements-form-modal__backdrop" popovertarget="add-achievements-modal"
        popovertargetaction="hide" aria-label="Tutup form tambah proyek"></button>

    <div class="achievements-form-modal__content">
        <button type="button" class="achievements-form-modal__close" popovertarget="add-achievements-modal"
            popovertargetaction="hide" aria-label="Tutup form tambah proyek">×</button>

        <h2 id="add-achievements-modal-title">Tambah Penghargaan Baru</h2>
        <form id="achievements-form" method="post" action="{% url 'main:create_achievements_ajax' %}"
            class="achievements-form">
            {% csrf_token %}
            {% for field in form %}
            <div class="form-group">
                <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                {{ field }}
                {% for error in field.errors %}
                <p class="form-error">{{ error }}</p>
                {% endfor %}
            </div>
            {% endfor %}
            <div class="achievements-form-modal__actions">
                <button type="button" class="button button-secondary" popovertarget="add-achievements-modal"
                    popovertargetaction="hide">Batal</button>
                <button type="submit" class="button">Tambah Penghargaan</button>
            </div>
        </form>
    </div>
</div>
