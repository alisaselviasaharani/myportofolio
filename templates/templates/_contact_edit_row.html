<tr id="contact-{{ contact.id }}" class="contact-edit-row">
    <td>✎</td>
    <td><input type="text" name="name" value="{{ contact.name }}" required form="edit-form-{{ contact.id }}"></td>
    <td><input type="email" name="email" value="{{ contact.email }}" required form="edit-form-{{ contact.id }}"></td>
    <td>
        <form id="edit-form-{{ contact.id }}" hx-put="{% url 'main:contact_update' contact.id %}" hx-headers=\'{"X-CSRFToken": "{{ csrf_token }}"}\'
              hx-target="#contact-{{ contact.id }}" hx-swap="outerHTML">
            {% csrf_token %}
            <button type="submit" class="contact-edit">✓</button>
        </form>
        <button type="button" class="contact-delete" hx-get="{% url 'main:contact_row' contact.id %}"
                hx-target="#contact-{{ contact.id }}" hx-swap="outerHTML">×</button>
    </td>
</tr>
