<p class="experience-status">
    <button type="button" class="button button-danger" popovertarget="delete-penghargaan-{{ penghargaan.id }}"
        aria-label="Hapus {{ penghargaan.title }}" title="Hapus penghargaan">
        Hapus Penghargaan
    </button>
</p>
<div id="delete-penghargaan-{{ penghargaan.id }}" class="penghargaan-delete-modal" popover="auto" role="dialog" aria-modal="true"
    aria-labelledby="delete-penghargaan-title-{{ penghargaan.id }}">
    <button type="button" class="penghargaan-delete-modal__backdrop" popovertarget="delete-penghargaan-{{ penghargaan.id }}"
        popovertargetaction="hide" aria-label="Tutup konfirmasi hapus"></button>
    <div class="penghargaan-delete-modal__content">
        <button type="button" class="penghargaan-delete-modal__close" popovertarget="delete-penghargaan-{{ penghargaan.id }}"
            popovertargetaction="hide" aria-label="Tutup konfirmasi hapus">×</button>
        <h2 id="delete-penghargaan-title-{{ penghargaan.id }}">Hapus Projek?</h2>
        <p>
            Apakah Anda yakin ingin menghapus
            <strong>{{ penghargaan.title }}</strong>?
        </p>
        <div class="penghargaan-delete-modal__actions">
            <button type="button" class="button button-secondary" popovertarget="delete-penghargaan-{{ penghargaan.id }}"
                popovertargetaction="hide">Batal</button>
            <form method="post" action="{% url 'main:delete_achievements' penghargaan.id %}">
                {% csrf_token %}
                <button type="submit" class="button button-danger">Ya, Hapus</button>
            </form>
        </div>
    </div>
</div>
