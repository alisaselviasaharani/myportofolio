<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- <title>Alisa Selvia Saharani - Portfolio</title> -->
    <title>{{ name }} - Portofolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>

<body>
    <header class="site-header">
        <div class="container">
            <!-- <a href="#profile" class="brand">Alisa Selvia Saharani</a> -->
            <a href="#profile" class="brand">{{ name }}</a>
            <nav>
                <a href="">Profile</a>
                <a href="#experience">Experience</a>
            </nav>
        </div>

    </header>

    <main class="pages">

        <!-- PAGE 2 : EDUCATION -->
        <section class="education-page" id="education">

            <!-- Gelembung -->
            <div class="bubbles">
                <span></span>
                <span></span>
                <span></span>
                <span></span>
                <span></span>
                <span></span>
                <span></span>
                <span></span>
            </div>


            <div class="education-content">

                <!-- Judul Education -->
                <div class="ketik">
                    <h1>EDUCATION</h1>
                </div>

                <!-- Kartu Education -->
                <div class="education-cards">

                    <!-- Universitas Indonesia -->
                    <div class="education-card">

                        <a href="https://cs.ui.ac.id/" class="education-link" target="_blank">
                            <img class="education-logo" src="/static/img/logoUI.png" alt="Logo Universitas Indonesia">
                        </a>
                        <h2>Universitas Indonesia</h2>
                        <p>S1 Ilmu Komputer</p>
                        <p>2025 - Present</p>

                    </div>

                    <!-- SMAN 65 Jakarta -->
                    <div class="education-card">
                        <a href="https://sman65jakarta.sch.id/" class="education-link" target="_blank">
                            <img class="education-logo" src="/static/img/logo65.jpg" alt="Logo SMAN 65 Jakarta">
                        </a>

                        <h2>SMAN 65 Jakarta</h2>
                        <p>Natural Science</p>
                        <p>2022 - 2025</p>
                    </div>

                    <!-- MTSN 12 Jakarta -->
                    <div class="education-card">
                        <a href="https://www.mtsn12jkt.sch.id/" class="education-link" target="_blank">
                            <img class="education-logo" src="/static/img/logomts.png" alt="Logo MTSN 12 Jakarta">
                        </a>
                        <h2>MTSN 12 Jakarta</h2>
                        <p>2019 - 2022</p>
                    </div>

                </div>

                <!-- ket: karna saya punya ide untuk dari page ke page selanjutnya dengan mengguankan swipe geser ke kanan jadinya
                saya menggunakan swipe hint agar pengunjung tau cara melihat informasi lainnya dengan cara di swipe ke kanan -->
                <!-- Peringatan untuk NEXT -->
                <div class="swipe-hint">
                    <span>Next</span>
                    <span class="arrow">→</span>

                </div>

            </div>

        </section>

    </main>

    <footer class="site-footer">
        <div class="container">
            <!-- <p>&copy; 2026 Alisa Selvia Saharani. Universitas Indonesia.</p> -->
            <p>&copy; 2026 {{ name }}. Fakultas Ilmu Komputer, Universitas Indonesia.</p>
        </div>
    </footer>
</body>

</html>
