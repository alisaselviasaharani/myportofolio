<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- <title>Alisa Selvia Saharani - Portfolio</title> -->
    <title>{{ name }} - Portofolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>

<body>
    <header class="site-header">
        <div class="container">
            <!-- <a href="#profile" class="brand">Alisa Selvia Saharani</a> -->
            <a href="#profile" class="brand">{{ name }}</a>
            <nav>
                <a href="">Profile</a>
                <a href="#experience">Experience</a>
            </nav>
        </div>

    </header>

    <main class="pages">
        <section class="hero" id="profile">
            <div class="container hero-grid">
                <div class="hero-identity">
                    <a href="https://cs.ui.ac.id/" class="hero-kicker">Computer Science · Universitas Indonesia</a>
                    <h1>Alisa Selvia Saharani</h1>
                </div>

                <!-- ket: pada page ini saya ingin menambahkan foto saya dan sosial media saya sehingga membuat kesanpertaa pengunjung tau bagaimana wujud saya -->
                <!-- PAGE 1 : ABOUTME -->
                <div class="hero-photo">
                    <div class="photo-block"></div>
                    <!-- <img class="avatar" src="/static/img/alisa.png" alt="Photo of Alisa Selvia Saharani"> -->
                    <img class="avatar" src="/static/img/alisa.png" alt="Photo of {{ name }}">
                </div>

                <!-- berikut ini sedikit deskripsi tentang saya -->
                <div class="hero-details">
                    <!-- <p class="bio">
                        Computer Science student at Universitas Indonesia who is interested in learning,
                        exploring new things, and developing skills in technology and data.
                    </p> -->
                    <p class="bio">{{ bio }}</p>

                    <dl class="meta-list">
                        <div class="meta-row">
                            <dt>NPM</dt>
                            <!-- <dd>2506618433</dd> -->
                            <dd style="color: black !important; display: block !important;">
                                {{ npm }}
                            </dd>
                        </div>

                        <div class="meta-row">
                            <dt>Program</dt>
                            <!-- <dd>S1 Ilmu Komputer</dd> -->
                            <!-- <dd>{{ study_program }}</dd> -->
                            <dd style="color: black !important; display: block !important;">
                                {{ study_program }}
                            </dd>
                        </div>
                    </dl>

                    <!-- sosial link jika ingin saling follow :) -->
                    <div class="social-links">
                        <a href="https://github.com/alisaselviasaharani" class="social-link">GitHub</a>
                        <a href="https://www.linkedin.com/in/alisaselviasaharani" class="social-link">LinkedIn</a>
                        <a href="mailto:alisa.selvia@ui.ac.id" class="social-link">Email</a>
                    </div>
                </div>

                <!-- ket: karna saya punya ide untuk dari page ke page selanjutnya dengan mengguankan swipe geser ke kanan jadinya
                saya menggunakan swipe hint agar pengunjung tau cara melihat informasi lainnya dengan cara di swipe ke kanan -->
                <!-- Peringatan untuk swipe-hint -->
                <div class="swipe-hint">
                    <span>Swipe/ Scroll to explore</span>
                    <span class="arrow">→</span>

                </div>

            </div>
        </section>
    </main>

    <footer class="site-footer">
        <div class="container">
            <!-- <p>&copy; 2026 Alisa Selvia Saharani. Universitas Indonesia.</p> -->
            <p>&copy; 2026 {{ name }}. Fakultas Ilmu Komputer, Universitas Indonesia.</p>
        </div>
    </footer>
</body>

</html>
