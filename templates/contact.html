<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- <title>Alisa Selvia Saharani - Portfolio</title> -->
    <title>{{ name }} - Portofolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>

<body>
    <header class="site-header">
        <div class="container">
            <!-- <a href="#profile" class="brand">Alisa Selvia Saharani</a> -->
            <a href="#profile" class="brand">{{ name }}</a>
            <nav>
                <a href="">Profile</a>
                <a href="#experience">Experience</a>
            </nav>
        </div>

    </header>

    <main class="pages">

        <!-- PAGE 6 : CONTACT -->
        <section class="contact-page" id="contact">

            <!-- Gelembung -->
            <div class="bubbles">
                <span></span>
                <span></span>
                <span></span>
                <span></span>
                <span></span>
                <span></span>
                <span></span>
                <span></span>
            </div>

            <div class="contact-content">

                <div class="ketik">
                    <h1>CONTACT</h1>
                </div>

                <!-- Bagian pesan + Nailong -->
                <div class="contact-message">

                    <div class="message-box">
                        <h2>Thank You for</h2>
                        <h2>Visiting My Portfolio!</h2>
                    </div>

                    <img class="nailong" src="/static/img/nailong1.png" alt="Nailong">

                </div>

                <h2 class="connect-title">Let's Connect!</h2>

                <!-- Contact buttons -->
                <div class="contact-cards">

                    <!-- LinkedIn -->
                    <a href="https://www.linkedin.com/in/alisaselviasaharani" class="contact-card" target="_blank">

                        <img class="contact-logo" src="/static/img/linkedin.png" alt="LinkedIn">

                        <span>LinkedIn</span>

                    </a>

                    <!-- GitHub -->
                    <a href="https://github.com/alisaselviasaharani" class="contact-card" target="_blank">

                        <img class="contact-logo" src="/static/img/github.png" alt="GitHub">

                        <span>GitHub</span>

                    </a>

                    <!-- Gmail -->
                    <a href="mailto:alisa.selvia@ui.ac.id" class="contact-card">

                        <img class="contact-logo" src="/static/img/gmail.png" alt="Email">

                        <span>Email</span>

                    </a>

                </div>

            </div>
        </section>
    </main>

    <footer class="site-footer">
        <div class="container">
            <!-- <p>&copy; 2026 Alisa Selvia Saharani. Universitas Indonesia.</p> -->
            <p>&copy; 2026 {{ name }}. Fakultas Ilmu Komputer, Universitas Indonesia.</p>
        </div>
    </footer>
</body>

</html>
