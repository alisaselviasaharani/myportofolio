{% for contact in contacts %}
<tr id="contact-{{ contact.id }}" class="contact-row">
    <td class="contact-number">{{ forloop.counter }}</td>
    <td class="contact-name-cell">{{ contact.name }}</td>
    <td class="contact-email-cell">{{ contact.email }}</td>
    <td class="contact-actions">
        <button type="button" class="contact-edit" aria-label="Edit {{ contact.name }}"
            hx-get="{% url 'main:contact_edit' contact.id %}" hx-headers=\'{"X-CSRFToken": "{{ csrf_token }}"}\' hx-target="closest tr" hx-swap="outerHTML">✎</button>
        <button type="button" class="contact-delete" aria-label="Delete {{ contact.name }}"
            hx-delete="{% url 'main:contact_delete' contact.id %}" hx-headers=\'{"X-CSRFToken": "{{ csrf_token }}"}\' hx-target="closest tr"
            hx-swap="outerHTML" hx-confirm="Hapus kontak ini?">▣</button>
    </td>
</tr>
{% empty %}
<tr><td colspan="4" class="contact-empty">🐠 Belum ada kontak. Tambahkan kontak pertamamu!</td></tr>
{% endfor %}
